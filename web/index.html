<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comfy-REST-Ext Tasks</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(13,17,23,.94);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .bar {
    max-width: 1400px; margin: 0 auto; padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 650; white-space: nowrap; }
  h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button, .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font: inherit;
    text-decoration: none; white-space: nowrap;
  }
  button:hover, .btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .primary:hover { border-color: #58a6ff; }
  input[type=search], select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit;
  }
  input[type=search] { min-width: 240px; }
  select { cursor: pointer; }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .spin {
    display: inline-block; width: 12px; height: 12px; margin-right: 5px;
    border: 2px solid #ffffff33; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; }
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 16px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .notice {
    display: none; background: #3d1418; border: 1px solid #6e2329;
    color: #ffb3ad; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px;
  }
  .notice.show { display: block; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
  }
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .toolbar + .toolbar { margin-top: -2px; }
  .segmented {
    display: inline-flex; background: #0b0f14; border: 1px solid var(--border);
    border-radius: 7px; padding: 2px; gap: 2px;
  }
  .segmented button {
    border: 0; background: transparent; color: var(--muted);
    padding: 5px 12px; border-radius: 5px;
  }
  .segmented button.active { background: var(--accent); color: #06101f; font-weight: 600; }
  .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: transparent; border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 11px; color: var(--muted);
  }
  .chip.active { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .field select, .field input { padding: 5px 8px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px; margin-top: 12px;
  }
  .card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    min-height: 170px; content-visibility: auto; contain-intrinsic-size: 260px;
  }
  .card.running { border-color: #2f5f9e; }
  .card.completed { border-color: #245c35; }
  .card.failed { border-color: #6e2329; }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kind {
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    padding: 2px 6px; border-radius: 4px; background: #21262d; color: var(--muted);
  }
  .kind.video { color: var(--purple); }
  .kind.image { color: var(--accent); }
  .model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; background: #21262d; color: var(--muted);
  }
  .badge.running { background: #173b63; color: #8cc8ff; }
  .badge.completed { background: #173d24; color: #7ee787; }
  .badge.failed { background: #4a1d20; color: #ffa198; }
  .badge.queued { background: #3d3213; color: #e3b341; }
  .prompt {
    margin: 0; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    word-break: break-word; min-height: 2.9em;
  }
  .prompt.empty { color: var(--muted); font-style: italic; }
  .progress {
    height: 7px; background: #0b0f14; border-radius: 999px; overflow: hidden;
    border: 1px solid #21262d;
  }
  .progress > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #1f6feb, #58a6ff);
    transition: width .3s ease;
  }
  .card.completed .progress > i { background: linear-gradient(90deg, #238636, #3fb950); }
  .card.failed .progress > i { background: var(--red); }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .meta b { color: var(--text); font-weight: 500; }
  .error {
    color: #ffa198; background: #2d1215; border: 1px solid #5c1f24;
    border-radius: 6px; padding: 7px 8px; font-size: 12px; word-break: break-word;
  }
  .media { display: grid; gap: 6px; }
  .media img, .media video {
    width: 100%; max-height: 260px; object-fit: contain;
    background: #000; border-radius: 6px; border: 1px solid var(--border);
    display: block;
  }
  .media .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .media .thumbs img { cursor: zoom-in; aspect-ratio: 1; object-fit: cover; }
  .media video { max-height: 300px; }
  .card-foot { margin-top: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .card-foot a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .card-foot a:hover { text-decoration: underline; }
  .empty { color: var(--muted); padding: 26px 4px; text-align: center; }
  .pager {
    display: flex; align-items: center; gap: 8px; justify-content: flex-end;
    margin-top: 14px; flex-wrap: wrap;
  }
  .pager .pages { display: flex; gap: 4px; flex-wrap: wrap; }
  .pager .pages button { min-width: 32px; padding: 5px 8px; }
  .pager .pages button.active { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  dialog {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 10px; padding: 14px; max-width: 94vw; max-height: 90vh;
  }
  dialog::backdrop { background: rgba(0,0,0,.82); }
  dialog h2 { margin: 0 0 10px; font-size: 16px; }
  dialog img { max-width: 90vw; max-height: 84vh; display: block; border-radius: 6px; }
  .dialog-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dialog-head h2 { margin: 0; }
  .models {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 10px; overflow: auto; max-height: 68vh;
  }
  .model-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .model-card header { display: flex; align-items: center; gap: 8px; }
  .model-card code { font-size: 12px; word-break: break-all; }
  .model-card .badge { margin-left: auto; }
  .model-card .line { color: var(--muted); font-size: 12px; }
  .generate-form {
    display: flex; flex-direction: column; gap: 10px;
    min-width: min(620px, 88vw);
  }
  .form-row, .form-grid label {
    display: flex; flex-direction: column; gap: 4px;
    color: var(--muted); font-size: 12px;
  }
  .form-row input, .form-row textarea, .form-row select,
  .form-grid input, .form-grid select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font: inherit; width: 100%;
  }
  .form-row textarea { resize: vertical; min-height: 64px; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .dialog-actions {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: #173d24; border: 1px solid #2ea043; color: #b7f7c1;
    padding: 9px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    z-index: 50; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: #3d1418; border-color: #6e2329; color: #ffb3ad; }
  @media (max-width: 720px) {
    .bar { padding: 10px 12px; }
    main { padding: 12px; }
    input[type=search] { min-width: 0; flex: 1 1 180px; }
    .grid { grid-template-columns: 1fr; }
    .pager { justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Comfy-REST-Ext <span>Tasks</span></h1>
    <span id="updated" class="muted small"></span>
    <div class="spacer"></div>
    <input id="search" type="search" placeholder="Search model, prompt, or id">
    <label class="toggle small"><input id="auto" type="checkbox" checked> auto</label>
    <button id="new-image-btn" class="primary" type="button">+ Image</button>
    <button id="new-video-btn" class="primary" type="button">+ Video</button>
    <button id="refresh" type="button"><span id="refresh-icon"></span>Refresh</button>
    <button id="models-btn" type="button">Models</button>
  </div>
</header>

<main>
  <div id="notice" class="notice"></div>

  <div class="stats">
    <div class="stat"><b id="stat-video-total">0</b><span>Videos</span></div>
    <div class="stat"><b id="stat-video-running">0</b><span>Videos active</span></div>
    <div class="stat"><b id="stat-image-total">0</b><span>Images</span></div>
    <div class="stat"><b id="stat-image-running">0</b><span>Images active</span></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <div id="kind-tabs" class="segmented">
        <button data-kind="all" type="button" class="active">All</button>
        <button data-kind="video" type="button">Videos</button>
        <button data-kind="image" type="button">Images</button>
      </div>
      <div class="spacer"></div>
      <label class="field">Sort
        <select id="sort">
          <option value="smart">Active first</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="model">Model</option>
          <option value="progress">Progress</option>
        </select>
      </label>
      <label class="field">Per page
        <select id="page-size">
          <option value="12">12</option>
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="96">96</option>
        </select>
      </label>
    </div>
    <div class="toolbar">
      <div id="status-chips" class="chips">
        <button class="chip active" data-status="all" type="button">All</button>
        <button class="chip" data-status="active" type="button">Active</button>
        <button class="chip" data-status="completed" type="button">Completed</button>
        <button class="chip" data-status="failed" type="button">Failed</button>
      </div>
      <label class="field">Model
        <select id="model-filter"><option value="">All models</option></select>
      </label>
      <span id="filter-summary" class="muted small"></span>
    </div>

    <div id="task-grid" class="grid"></div>
    <div id="empty" class="empty" hidden>No tasks match these filters.</div>

    <div class="pager">
      <button id="first-page" type="button">First</button>
      <button id="prev-page" type="button">Prev</button>
      <div id="pages" class="pages"></div>
      <button id="next-page" type="button">Next</button>
      <button id="last-page" type="button">Last</button>
      <span id="page-info" class="muted small"></span>
    </div>
  </div>
</main>

<dialog id="generate-dialog">
  <div class="dialog-head">
    <h2 id="generate-title">Generate image</h2>
    <div class="spacer"></div>
    <button id="generate-close" type="button">Close</button>
  </div>
  <form id="generate-form" class="generate-form">
    <div id="generate-tabs" class="segmented">
      <button type="button" data-mode="image" class="active">Image</button>
      <button type="button" data-mode="video">Video</button>
    </div>
    <label class="form-row">Model
      <select id="gen-model" required></select>
    </label>
    <label class="form-row">Prompt
      <textarea id="gen-prompt" rows="4" required placeholder="Describe the image or video..."></textarea>
    </label>
    <label class="form-row" id="gen-negative-row">Negative prompt
      <textarea id="gen-negative" rows="2" placeholder="Optional"></textarea>
    </label>
    <div id="image-fields" class="form-grid">
      <label>Size
        <input id="gen-size" list="size-presets" placeholder="1024x1024">
      </label>
      <datalist id="size-presets">
        <option value="512x512"></option>
        <option value="768x768"></option>
        <option value="1024x1024"></option>
        <option value="1328x1328"></option>
        <option value="1536x1536"></option>
        <option value="1664x928"></option>
        <option value="928x1664"></option>
        <option value="2048x2048"></option>
      </datalist>
      <label>Images (n)
        <input id="gen-n" type="number" min="1" max="8" value="1">
      </label>
      <label>Steps
        <input id="gen-steps" type="number" min="1" value="30">
      </label>
      <label>CFG
        <input id="gen-cfg" type="number" step="0.1" value="4.0">
      </label>
      <label>Sampler
        <input id="gen-sampler" placeholder="euler">
      </label>
      <label>Scheduler
        <input id="gen-scheduler" placeholder="simple">
      </label>
    </div>
    <div id="video-fields" class="form-grid" hidden>
      <label>Width
        <input id="gen-width" type="number" min="256" step="8" value="1344">
      </label>
      <label>Height
        <input id="gen-height" type="number" min="256" step="8" value="768">
      </label>
      <label>Seconds
        <input id="gen-seconds" type="number" min="1" step="0.5" value="5">
      </label>
      <label>Speed
        <select id="gen-speed">
          <option value="auto">auto</option>
          <option value="none">none</option>
          <option value="te-speed">te-speed</option>
          <option value="sol-stack">sol-stack</option>
        </select>
      </label>
    </div>
    <div class="form-grid">
      <label>Seed
        <input id="gen-seed" type="number" min="0" value="0">
      </label>
    </div>
    <div id="generate-error" class="error" hidden></div>
    <div class="dialog-actions">
      <button type="button" id="generate-cancel">Cancel</button>
      <button type="submit" id="generate-submit" class="primary">Generate</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<dialog id="models-dialog">
  <div class="dialog-head">
    <h2>Models</h2>
    <span id="models-note" class="muted small"></span>
    <div class="spacer"></div>
    <button id="models-close" type="button">Close</button>
  </div>
  <div id="models-grid" class="models"></div>
</dialog>

<dialog id="lightbox">
  <img id="lightbox-img" alt="">
</dialog>

<script>
(() => {
  "use strict";

  const ACTIVE = new Set(["queued", "running", "in_progress"]);
  const STATUS_LABEL = { in_progress: "running", running: "running" };

  const state = {
    videos: [],
    images: [],
    catalog: [],
    filters: { kind: "all", status: "all", model: "", query: "" },
    sort: "smart",
    page: 1,
    pageSize: Number(localStorage.getItem("comfy-rest-ext.pageSize")) || 12,
    loading: false,
    timer: null,
    fetchedAt: null,
    modelOptionsSig: "",
    generateMode: "image",
  };

  const $ = (id) => document.getElementById(id);
  const grid = $("task-grid");
  const cardCache = new Map();
  let catalogPromise = null;

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function fmtTime(ts) {
    if (!ts) return "—";
    try { return new Date(Number(ts) * 1000).toLocaleString(); }
    catch (_) { return String(ts); }
  }

  function fmtDuration(seconds) {
    if (seconds == null || isNaN(seconds)) return "—";
    const s = Math.max(0, Math.round(Number(seconds)));
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m " + (s % 60) + "s";
    return Math.floor(m / 60) + "h " + (m % 60) + "m";
  }

  function statusClass(status) {
    if (ACTIVE.has(status)) return "running";
    return status || "queued";
  }

  function statusLabel(status) {
    return STATUS_LABEL[status] || status || "unknown";
  }

  function normalizeVideo(task) {
    return {
      kind: "video",
      id: task.id,
      object: task.object || "video",
      model: task.model || "",
      prompt: task.prompt || "",
      status: task.status || "unknown",
      progress: Number(task.progress || 0),
      current_node: task.current_node || "",
      node_progress: Number(task.node_progress || 0),
      eta: task.eta,
      elapsed: task.elapsed,
      size: task.size || "",
      seconds: task.seconds,
      n: 0,
      created_at: task.created_at,
      completed_at: task.completed_at,
      error: task.error,
      media: task.view_url ? [task.view_url] : [],
      json_url: "/v1/videos/" + encodeURIComponent(task.id),
    };
  }

  function normalizeImage(task) {
    return {
      kind: "image",
      id: task.id,
      object: task.object || "image.generation",
      model: task.model || "",
      prompt: task.prompt || "",
      status: task.status || "unknown",
      progress: Number(task.progress || 0),
      current_node: task.current_node || "",
      node_progress: Number(task.node_progress || 0),
      eta: task.eta,
      elapsed: null,
      size: task.size || "",
      seconds: null,
      n: task.n || 1,
      created_at: task.created_at,
      completed_at: task.completed_at,
      error: task.error,
      media: task.view_urls || [],
      json_url: "/v2/extension/image/" + encodeURIComponent(task.id),
    };
  }

  function allTasks() {
    return state.videos.concat(state.images);
  }

  function hasActive() {
    return allTasks().some((task) => ACTIVE.has(task.status));
  }

  function matches(task) {
    const f = state.filters;
    if (f.kind !== "all" && task.kind !== f.kind) return false;
    if (f.model && task.model !== f.model) return false;
    if (f.status === "active" && !ACTIVE.has(task.status)) return false;
    if (f.status === "completed" && task.status !== "completed") return false;
    if (f.status === "failed" && task.status !== "failed") return false;
    if (f.query) {
      const q = f.query.toLowerCase();
      if (![task.id, task.model, task.prompt, task.status]
        .some((value) => String(value || "").toLowerCase().includes(q))) return false;
    }
    return true;
  }

  function filteredTasks() {
    return allTasks().filter(matches).sort((a, b) => {
      if (state.sort === "smart") {
        const activeA = ACTIVE.has(a.status) ? 0 : 1;
        const activeB = ACTIVE.has(b.status) ? 0 : 1;
        if (activeA !== activeB) return activeA - activeB;
        return (b.created_at || 0) - (a.created_at || 0);
      }
      if (state.sort === "newest") return (b.created_at || 0) - (a.created_at || 0);
      if (state.sort === "oldest") return (a.created_at || 0) - (b.created_at || 0);
      if (state.sort === "model") {
        const cmp = String(a.model).localeCompare(String(b.model));
        return cmp || (b.created_at || 0) - (a.created_at || 0);
      }
      return (b.progress || 0) - (a.progress || 0);
    });
  }

  function createCard(task) {
    const el = document.createElement("article");
    el.className = "card";
    el.innerHTML = `
      <div class="card-top">
        <span class="kind"></span>
        <span class="model"></span>
        <span class="badge"></span>
      </div>
      <p class="prompt"></p>
      <div class="progress"><i></i></div>
      <div class="meta"></div>
      <div class="error" hidden></div>
      <div class="media" hidden></div>
      <div class="card-foot">
        <a class="json-link" target="_blank" rel="noreferrer">JSON</a>
        <a class="open-link" target="_blank" rel="noreferrer" hidden>Open output</a>
      </div>`;
    return {
      el,
      kind: el.querySelector(".kind"),
      model: el.querySelector(".model"),
      badge: el.querySelector(".badge"),
      prompt: el.querySelector(".prompt"),
      progress: el.querySelector(".progress > i"),
      meta: el.querySelector(".meta"),
      error: el.querySelector(".error"),
      media: el.querySelector(".media"),
      json: el.querySelector(".json-link"),
      open: el.querySelector(".open-link"),
      mediaSig: null,
    };
  }

  function updateCard(card, task) {
    const cls = statusClass(task.status);
    card.el.className = "card " + cls;
    card.el.dataset.id = task.id;
    card.kind.textContent = task.kind === "video" ? "VIDEO" : "IMAGE";
    card.kind.className = "kind " + task.kind;
    card.model.textContent = task.model || "unknown";
    card.badge.textContent = statusLabel(task.status);
    card.badge.className = "badge " + cls;
    card.prompt.textContent = task.prompt || "(no prompt)";
    card.prompt.classList.toggle("empty", !task.prompt);
    card.progress.style.width = Math.max(0, Math.min(100, task.progress || 0)) + "%";

    const meta = [];
    if (task.size) meta.push(`<span>size <b>${esc(task.size)}</b></span>`);
    if (task.seconds) meta.push(`<span>seconds <b>${esc(task.seconds)}</b></span>`);
    if (task.n) meta.push(`<span>n <b>${esc(task.n)}</b></span>`);
    if (task.current_node && ACTIVE.has(task.status)) {
      meta.push(`<span>node <b>${esc(task.current_node)}</b> ${esc(task.node_progress)}%</span>`);
    }
    if (task.eta != null && ACTIVE.has(task.status)) {
      meta.push(`<span>eta <b>${esc(fmtDuration(task.eta))}</b></span>`);
    } else if (task.elapsed != null) {
      meta.push(`<span>elapsed <b>${esc(fmtDuration(task.elapsed))}</b></span>`);
    }
    meta.push(`<span title="${esc(fmtTime(task.created_at))}">${esc(fmtTime(task.created_at))}</span>`);
    card.meta.innerHTML = meta.join("");

    const message = task.error && task.error.message ? task.error.message : "";
    card.error.hidden = !message;
    card.error.textContent = message;

    const mediaSig = task.status + "|" + task.media.join("|");
    if (mediaSig !== card.mediaSig) {
      card.mediaSig = mediaSig;
      card.media.replaceChildren();
      if (task.status === "completed" && task.media.length) {
        card.media.hidden = false;
        if (task.kind === "video") {
          const video = document.createElement("video");
          video.controls = true;
          video.preload = "none";
          video.playsInline = true;
          video.src = task.media[0];
          card.media.append(video);
        } else {
          const thumbs = document.createElement("div");
          thumbs.className = "thumbs";
          task.media.forEach((url, index) => {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = url;
            img.alt = "output " + (index + 1);
            img.dataset.full = url;
            thumbs.append(img);
          });
          card.media.append(thumbs);
        }
      } else {
        card.media.hidden = true;
      }
    }

    card.json.href = task.json_url;
    if (task.media.length) {
      card.open.hidden = false;
      card.open.href = task.media[0];
    } else {
      card.open.hidden = true;
      card.open.removeAttribute("href");
    }
  }

  function getCard(task) {
    let card = cardCache.get(task.id);
    if (!card) {
      card = createCard(task);
      cardCache.set(task.id, card);
    }
    updateCard(card, task);
    return card.el;
  }

  function renderStats() {
    const videos = state.videos;
    const images = state.images;
    const active = (list) => list.filter((task) => ACTIVE.has(task.status)).length;
    $("stat-video-total").textContent = videos.length;
    $("stat-video-running").textContent = active(videos);
    $("stat-image-total").textContent = images.length;
    $("stat-image-running").textContent = active(images);
  }

  function renderModelOptions() {
    const select = $("model-filter");
    const current = state.filters.model;
    const models = new Set(allTasks().map((task) => task.model).filter(Boolean));
    for (const model of state.catalog) {
      if (model.canonical && model.canonical !== model.id) continue;
      models.add(model.id);
    }
    if (current) models.add(current);
    const sorted = Array.from(models).sort();
    const signature = sorted.join("\n");
    if (signature !== state.modelOptionsSig) {
      state.modelOptionsSig = signature;
      const options = ['<option value="">All models</option>'];
      for (const model of sorted) {
        options.push(`<option value="${esc(model)}">${esc(model)}</option>`);
      }
      select.innerHTML = options.join("");
    }
    select.value = current;
  }

  function renderFilterSummary(total, shown) {
    $("filter-summary").textContent = `${shown} of ${total} tasks`;
  }

  function renderPager(total, pages) {
    const page = state.page;
    document.querySelector(".pager").hidden = total === 0;
    $("page-info").textContent = `Page ${page} / ${pages}`;
    $("first-page").disabled = page <= 1;
    $("prev-page").disabled = page <= 1;
    $("next-page").disabled = page >= pages;
    $("last-page").disabled = page >= pages;

    const container = $("pages");
    const buttons = [];
    const add = (n) => buttons.push(
      `<button type="button" data-page="${n}" class="${n === page ? "active" : ""}">${n}</button>`
    );
    const pageSet = new Set([1, pages, page - 1, page, page + 1]);
    const sorted = Array.from(pageSet).filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
    let previous = 0;
    for (const n of sorted) {
      if (previous && n - previous > 1) buttons.push('<span class="muted">…</span>');
      add(n);
      previous = n;
    }
    container.innerHTML = buttons.join("");
  }

  function renderList() {
    const filtered = filteredTasks();
    const total = filtered.length;
    const pages = Math.max(1, Math.ceil(total / state.pageSize));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    const start = (state.page - 1) * state.pageSize;
    const pageTasks = filtered.slice(start, start + state.pageSize);

    const allIds = new Set(allTasks().map((task) => task.id));
    for (const id of Array.from(cardCache.keys())) {
      if (!allIds.has(id)) cardCache.delete(id);
    }

    const desired = pageTasks.map(getCard);
    const current = Array.from(grid.children);
    if (current.length !== desired.length || current.some((node, i) => node !== desired[i])) {
      for (const node of current) {
        if (node.tagName === "ARTICLE" && node.querySelector("video")) {
          node.querySelector("video").pause();
        }
      }
      grid.replaceChildren(...desired);
    }

    $("empty").hidden = total !== 0;
    grid.hidden = total === 0;
    renderFilterSummary(allTasks().length, total);
    renderPager(total, pages);
  }

  function renderAll() {
    renderStats();
    renderModelOptions();
    renderList();
  }

  async function fetchJson(url) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 12000);
    try {
      const response = await fetch(url, { cache: "no-store", signal: controller.signal });
      if (!response.ok) throw new Error(url + " -> HTTP " + response.status);
      return await response.json();
    } finally {
      clearTimeout(timeout);
    }
  }

  function setBusy(busy) {
    $("refresh-icon").innerHTML = busy ? '<span class="spin"></span>' : "";
    $("refresh").disabled = busy;
  }

  function showNotice(message) {
    const notice = $("notice");
    notice.textContent = message;
    notice.classList.toggle("show", Boolean(message));
  }

  async function load() {
    if (state.loading) return;
    state.loading = true;
    setBusy(true);
    try {
      const [videos, images] = await Promise.allSettled([
        fetchJson("/v1/videos"),
        fetchJson("/v2/extension/image"),
      ]);
      const errors = [];
      if (videos.status === "fulfilled") {
        state.videos = (videos.value.data || []).map(normalizeVideo);
      } else {
        errors.push("videos: " + videos.reason.message);
      }
      if (images.status === "fulfilled") {
        state.images = (images.value.tasks || []).map(normalizeImage);
      } else {
        errors.push("images: " + images.reason.message);
      }
      if (errors.length === 2) {
        showNotice("Refresh failed: " + errors.join("; "));
      } else {
        showNotice(errors.length ? "Partial refresh: " + errors.join("; ") : "");
        state.fetchedAt = new Date();
        $("updated").textContent = "updated " + state.fetchedAt.toLocaleTimeString();
        renderAll();
      }
    } finally {
      state.loading = false;
      setBusy(false);
      schedule();
    }
  }

  function schedule() {
    if (state.timer) clearTimeout(state.timer);
    state.timer = null;
    if (!$("auto").checked || document.hidden) return;
    state.timer = setTimeout(load, hasActive() ? 2000 : 5000);
  }

  function resetPageAndRender() {
    state.page = 1;
    renderList();
  }

  function setKind(kind) {
    state.filters.kind = kind;
    document.querySelectorAll("#kind-tabs button").forEach((button) => {
      button.classList.toggle("active", button.dataset.kind === kind);
    });
    resetPageAndRender();
  }

  function setStatus(status) {
    state.filters.status = status;
    document.querySelectorAll("#status-chips .chip").forEach((button) => {
      button.classList.toggle("active", button.dataset.status === status);
    });
    resetPageAndRender();
  }

  function goPage(page) {
    const filtered = filteredTasks();
    const pages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    state.page = Math.max(1, Math.min(pages, page));
    renderList();
  }

  async function ensureCatalog() {
    if (state.catalog.length) return state.catalog;
    if (!catalogPromise) {
      catalogPromise = fetchJson("/v1/models").then((data) => {
        state.catalog = data.data || [];
        renderModelOptions();
        return state.catalog;
      }).finally(() => { catalogPromise = null; });
    }
    return catalogPromise;
  }

  async function openModels() {
    const dialog = $("models-dialog");
    dialog.showModal();
    if (state.catalog.length) {
      $("models-note").textContent = state.catalog.length + " models";
      renderModels();
      return;
    }
    $("models-note").textContent = "loading…";
    try {
      await ensureCatalog();
      $("models-note").textContent = state.catalog.length + " models";
      renderModels();
    } catch (error) {
      $("models-note").textContent = "failed: " + error.message;
    }
  }

  function renderModels() {
    const container = $("models-grid");
    const models = state.catalog.filter(
      (model) => !model.canonical || model.canonical === model.id
    );
    container.innerHTML = models.map((model) => {
      const defaults = model.defaults || {};
      const bits = [];
      if (defaults.size) bits.push("size " + defaults.size);
      if (defaults.steps) bits.push("steps " + defaults.steps);
      if (defaults.cfg != null) bits.push("cfg " + defaults.cfg);
      if (defaults.sampler) bits.push(defaults.sampler);
      if (defaults.resolution) bits.push("resolution " + defaults.resolution);
      const caps = (model.capabilities || []).join(", ");
      return `<article class="model-card">
        <header><code>${esc(model.id)}</code><span class="badge ${model.modality === "image" ? "running" : ""}">${esc(model.modality || "video")}</span></header>
        <div class="line">tasks: ${esc((model.tasks || []).join(", ") || "—")}</div>
        ${bits.length ? `<div class="line">${esc(bits.join(" · "))}</div>` : ""}
        ${caps ? `<div class="line">${esc(caps)}</div>` : ""}
        <div class="line" style="margin-top:auto">
          <button type="button" data-model="${esc(model.id)}">Filter tasks</button>
        </div>
      </article>`;
    }).join("");
  }

  function renderGenerateModels() {
    const select = $("gen-model");
    const models = state.catalog.filter((model) =>
      (!model.canonical || model.canonical === model.id) &&
      model.modality === state.generateMode
    );
    select.innerHTML = models.length
      ? models.map((model) => `<option value="${esc(model.id)}">${esc(model.id)}</option>`).join("")
      : '<option value="">(no model available)</option>';
    if (models.length) select.value = models[0].id;
  }

  function applyGenerateDefaults() {
    const model = state.catalog.find((item) => item.id === $("gen-model").value);
    const defaults = (model && model.defaults) || {};
    if (state.generateMode === "image") {
      $("gen-size").value = "1024x1024";
      $("gen-n").value = "1";
      $("gen-steps").value = defaults.steps || 25;
      $("gen-cfg").value = defaults.cfg != null ? defaults.cfg : 1.0;
      $("gen-sampler").value = defaults.sampler || "euler";
      $("gen-scheduler").value = defaults.scheduler || "simple";
      $("gen-negative").value = defaults.negative_prompt || "";
    } else {
      $("gen-width").value = defaults.width || 1344;
      $("gen-height").value = defaults.height || 768;
      $("gen-seconds").value = defaults.seconds || 5;
      $("gen-speed").value = "auto";
    }
    $("gen-seed").value = "0";
  }

  function setGenerateMode(mode) {
    state.generateMode = mode;
    document.querySelectorAll("#generate-tabs button").forEach((button) => {
      button.classList.toggle("active", button.dataset.mode === mode);
    });
    $("generate-title").textContent = mode === "image" ? "Generate image" : "Generate video";
    $("image-fields").hidden = mode !== "image";
    $("video-fields").hidden = mode !== "video";
    $("gen-negative-row").hidden = mode !== "image";
    $("generate-error").hidden = true;
    renderGenerateModels();
    applyGenerateDefaults();
  }

  async function openGenerate(mode) {
    setGenerateMode(mode);
    $("generate-dialog").showModal();
    try {
      await ensureCatalog();
      renderGenerateModels();
      applyGenerateDefaults();
    } catch (error) {
      showGenerateError(error.message);
    }
    setTimeout(() => $("gen-prompt").focus(), 30);
  }

  function showGenerateError(message) {
    const box = $("generate-error");
    box.textContent = message || "";
    box.hidden = !message;
  }

  function setGenerateBusy(busy) {
    $("generate-submit").disabled = busy;
    $("generate-submit").textContent = busy ? "Generating…" : "Generate";
  }

  function toast(message, isError = false) {
    const box = $("toast");
    box.textContent = message;
    box.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => box.classList.remove("show"), 3500);
  }

  function numberValue(id, fallback) {
    const value = Number($(id).value);
    return Number.isFinite(value) ? value : fallback;
  }

  async function submitGenerate(event) {
    event.preventDefault();
    showGenerateError("");
    const mode = state.generateMode;
    const prompt = $("gen-prompt").value.trim();
    if (!prompt) {
      showGenerateError("prompt is required");
      return;
    }
    const model = $("gen-model").value;
    if (!model) {
      showGenerateError("no model available");
      return;
    }

    const payload = {
      model,
      prompt,
      seed: numberValue("gen-seed", 0),
    };
    if (mode === "image") {
      const size = $("gen-size").value.trim();
      if (size) payload.size = size;
      payload.n = numberValue("gen-n", 1);
      payload.steps = numberValue("gen-steps", 25);
      payload.cfg = numberValue("gen-cfg", 1.0);
      payload.sampler = $("gen-sampler").value.trim() || "euler";
      payload.scheduler = $("gen-scheduler").value.trim() || "simple";
      const negative = $("gen-negative").value.trim();
      if (negative) payload.negative_prompt = negative;
    } else {
      payload.width = numberValue("gen-width", 1344);
      payload.height = numberValue("gen-height", 768);
      payload.seconds = numberValue("gen-seconds", 5);
      payload.speed = $("gen-speed").value;
    }

    const url = mode === "image" ? "/v1/images/generations" : "/v1/videos";
    const headers = { "Content-Type": "application/json" };
    if (mode === "image") headers.Prefer = "respond-async";

    setGenerateBusy(true);
    try {
      const response = await fetch(url, {
        method: "POST",
        headers,
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const message = data.error && (data.error.message || data.error);
        throw new Error(message || `HTTP ${response.status}`);
      }
      const id = data.id || data.task_id || "";
      $("generate-dialog").close();
      $("gen-prompt").value = "";
      $("gen-negative").value = "";
      toast("Queued " + (id || "task"));
      state.page = 1;
      load();
    } catch (error) {
      showGenerateError(error.message || String(error));
    } finally {
      setGenerateBusy(false);
    }
  }

  function filterByModel(model, modality) {
    state.filters.model = model;
    $("model-filter").value = model;
    if (modality === "video" || modality === "image") {
      state.filters.kind = modality;
      document.querySelectorAll("#kind-tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.kind === modality);
      });
    }
    resetPageAndRender();
  }

  $("refresh").addEventListener("click", () => {
    if (state.timer) clearTimeout(state.timer);
    state.timer = null;
    load();
  });
  $("auto").addEventListener("change", schedule);
  $("search").addEventListener("input", (() => {
    let timer = null;
    return (event) => {
      const value = event.target.value.trim();
      clearTimeout(timer);
      timer = setTimeout(() => {
        state.filters.query = value;
        resetPageAndRender();
      }, 180);
    };
  })());
  document.querySelectorAll("#kind-tabs button").forEach((button) => {
    button.addEventListener("click", () => setKind(button.dataset.kind));
  });
  document.querySelectorAll("#status-chips .chip").forEach((button) => {
    button.addEventListener("click", () => setStatus(button.dataset.status));
  });
  $("sort").addEventListener("change", (event) => {
    state.sort = event.target.value;
    resetPageAndRender();
  });
  $("page-size").addEventListener("change", (event) => {
    state.pageSize = Number(event.target.value) || 12;
    localStorage.setItem("comfy-rest-ext.pageSize", String(state.pageSize));
    resetPageAndRender();
  });
  $("model-filter").addEventListener("change", (event) => {
    state.filters.model = event.target.value;
    resetPageAndRender();
  });
  $("first-page").addEventListener("click", () => goPage(1));
  $("prev-page").addEventListener("click", () => goPage(state.page - 1));
  $("next-page").addEventListener("click", () => goPage(state.page + 1));
  $("last-page").addEventListener("click", () => {
    goPage(Math.max(1, Math.ceil(filteredTasks().length / state.pageSize)));
  });
  $("pages").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-page]");
    if (button) goPage(Number(button.dataset.page));
  });
  $("models-btn").addEventListener("click", openModels);
  $("new-image-btn").addEventListener("click", () => openGenerate("image"));
  $("new-video-btn").addEventListener("click", () => openGenerate("video"));
  $("generate-tabs").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-mode]");
    if (button) setGenerateMode(button.dataset.mode);
  });
  $("gen-model").addEventListener("change", applyGenerateDefaults);
  $("generate-form").addEventListener("submit", submitGenerate);
  $("generate-close").addEventListener("click", () => $("generate-dialog").close());
  $("generate-cancel").addEventListener("click", () => $("generate-dialog").close());
  $("generate-dialog").addEventListener("click", (event) => {
    if (event.target === $("generate-dialog")) $("generate-dialog").close();
  });
  $("models-close").addEventListener("click", () => $("models-dialog").close());
  $("models-grid").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-model]");
    if (!button) return;
    const model = state.catalog.find((item) => item.id === button.dataset.model);
    filterByModel(button.dataset.model, model && model.modality);
    $("models-dialog").close();
  });
  document.addEventListener("click", (event) => {
    const img = event.target.closest("img[data-full]");
    if (img) {
      event.preventDefault();
      $("lightbox-img").src = img.dataset.full;
      $("lightbox").showModal();
    }
  });
  $("lightbox").addEventListener("click", (event) => {
    if (event.target === $("lightbox")) $("lightbox").close();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (state.timer) clearTimeout(state.timer);
      state.timer = null;
    } else {
      load();
    }
  });

  $("page-size").value = String(state.pageSize);
  load();
})();
</script>
</body>
</html>
